<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8F3">
<title>셈판</title>
<!--@ICONS@-->
<style>
/*@FONTS@*/
:root{
  --paper:#F7F8F3; --grid:#DCE6EF; --ink:#1D2F6F; --text:#22252B; --muted:#5E6573;
  --red:#D3302A; --hl:#F5E23B; --hlText:#2A2600; --goldEdge:#B9A400; --card:#FFFFFF; --edge:#C3CEDB; --op:#E8EEF8;
  --scrim:rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#1C2723; --grid:#26342E; --ink:#B3CBFF; --text:#ECEFE8; --muted:#A3AEA7;
    --red:#FF6B5E; --hl:#E8D53A; --card:#26332E; --edge:#3E4F47; --op:#2C3B45;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1C2723; --grid:#26342E; --ink:#B3CBFF; --text:#ECEFE8; --muted:#A3AEA7;
  --red:#FF6B5E; --hl:#E8D53A; --card:#26332E; --edge:#3E4F47; --op:#2C3B45;
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%}
body{
  margin:0; min-height:100vh; color:var(--text); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px; background-attachment:fixed;
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
.h{font-family:"Gaegu","Comic Sans MS",cursive; font-weight:700}
[hidden]{display:none !important}
button{font:inherit; color:inherit}
.wrap{max-width:520px; margin:0 auto; padding:14px; display:flex; flex-direction:column; gap:12px; overflow-x:clip}
html,body{overflow-x:hidden}
.muted{color:var(--muted)}
.sect{font-size:.8rem; font-weight:600; color:var(--muted); margin:0}

/* 버튼 */
.btn{display:block; width:100%; font-size:1rem; font-weight:600; padding:13px 10px; border-radius:10px; cursor:pointer; border:2px solid var(--ink); background:var(--ink); color:var(--paper)}
.btn.ghost{background:var(--card); color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(2px); opacity:.8}
.btn:disabled{opacity:.4; cursor:not-allowed}
.chip{font-size:.8rem; font-weight:600; color:var(--ink); background:var(--card); border:2px solid var(--ink); border-radius:999px; padding:6px 12px; cursor:pointer; white-space:nowrap}
.chip:active{opacity:.7}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--red); outline-offset:2px}
.hlmark{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}

/* 헤더 */
header{display:flex; align-items:center; gap:8px; white-space:nowrap}
header .back{width:32px; height:32px; border:0; background:none; color:var(--ink); font-size:1.4rem; cursor:pointer; padding:0}
header .back:disabled{opacity:.3}
header .title{font-size:2.1rem; color:var(--ink); line-height:1}
header .sp{flex:1}
header .where{font-size:.8rem; color:var(--muted)}
header .gold{font-size:.8rem; color:var(--muted)}
header .gold b{font-family:"Gaegu",cursive; font-size:1.4rem; color:var(--text)}

/* 메인 메뉴 */
.menu{gap:18px; padding:20px}
.logo{text-align:center; padding-top:30px}
.logo .big{font-size:4.5rem; color:var(--ink); line-height:1}
.logo p{margin:6px 0 0; font-size:.9rem; color:var(--muted)}
.logo .eq{display:flex; justify-content:center; align-items:center; gap:6px; margin-top:12px}
.logo .eq .card{width:44px; font-size:26px}
.logo .eq > span{font-size:1.9rem; color:var(--red)}
.slot-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px; background:var(--card); border:2px solid var(--edge); border-radius:12px; cursor:pointer}
.slot-row.sel{border-color:var(--ink); border-width:2.5px}
.slot-row .num{flex:none; width:44px; height:44px; border-radius:50%; border:2px solid var(--ink); display:grid; place-items:center; font-size:1.75rem; color:var(--ink); background:var(--card)}
.slot-row.sel .num{background:var(--ink); color:var(--paper)}
.slot-row .info{flex:1; display:grid; gap:2px; min-width:0}
.slot-row .t{font-size:.9rem; font-weight:600; color:var(--ink)}
.slot-row .t.empty{color:var(--muted)}
.slot-row small{font-size:.75rem; color:var(--muted)}
.slot-row .del{flex:none; width:36px; height:36px; border:0; background:none; color:var(--red); font-size:1.1rem; cursor:pointer}
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.tile{display:grid; justify-items:center; gap:4px; padding:14px 6px; background:var(--card); border:2px solid var(--ink); border-radius:12px; box-shadow:0 3px 0 var(--ink); cursor:pointer}
.tile .ic{font-size:2rem}
.tile b{font-size:.9rem; color:var(--ink)}
.tile .v{font-size:1.25rem; color:var(--red)}
.tile small{font-size:.7rem; color:var(--muted)}

/* 카드 */
.card{position:relative; aspect-ratio:3/4; width:100%; border:1.5px solid var(--edge); border-radius:8px; background:var(--card); color:var(--ink);
  box-shadow:0 3px 0 var(--edge); display:grid; place-items:center; padding:0; font-family:"Gaegu",cursive; font-weight:700; line-height:1}
.card.noshadow{box-shadow:none}
.card .face{margin-bottom:.35em; white-space:nowrap}
.card.corner{place-items:start}
.card.corner .face{margin:.08em 0 0 .15em}
.card .face small{font-size:.6em}
.card .face sup{font-size:.6em; vertical-align:.6em; line-height:0}
.card.op{background:var(--op); color:var(--red)}
.card.e-gold{background:var(--hl); color:var(--hlText); border-color:var(--goldEdge)}
.card.e-fire{border:2px solid var(--red)}
.card.e-luck{border:2px dashed var(--ink)}
.card.trans::after{content:""; position:absolute; inset:2px; border:3px solid var(--hl); border-radius:6px; pointer-events:none}
.bds{position:absolute; left:2px; right:2px; bottom:3px; display:flex; flex-wrap:wrap; justify-content:center; gap:2px}
/* 배지가 3개 이상이면 작게 줄여 두 줄로 쌓아요 (아래에서 위로) */
.bds.many{gap:1px}
.bds.many .bd{font-size:6.5px; padding:0 2px}
.bd{font-family:system-ui,sans-serif; font-style:normal; font-size:8px; font-weight:600; line-height:1.3; padding:0 3px; border-radius:3px; background:var(--paper); color:var(--text); border:1px solid var(--edge); white-space:nowrap}
.bd-fire{color:var(--red); border-color:var(--red)}
.bd-gold{background:var(--hlText); color:var(--hl); border-color:var(--hlText)}
.bd-up{color:var(--ink)}
.bd-op{background:var(--red); color:#fff; border-color:var(--red)}
.ghostcard{aspect-ratio:3/4; border:1.5px dashed var(--edge); border-radius:7px; display:grid; place-items:center; color:var(--muted); font-size:.7rem}
.cardbtn{border:0; padding:0; background:none; cursor:pointer; display:block; width:100%}

/* 지도 */
.mapt{font-size:1.75rem; color:var(--ink); margin:0; line-height:1}
.mapmsg{font-size:1.2rem; color:var(--red); margin:0}
.map{position:relative; width:100%}
.map svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.map line{stroke:var(--edge); stroke-width:2; stroke-dasharray:3 5; vector-effect:non-scaling-stroke}
.map line.live{stroke:var(--ink); stroke-width:2.5; stroke-dasharray:none}
.map line.walked{stroke:var(--red); stroke-width:3; stroke-dasharray:none}
.fl{position:absolute; left:2px; transform:translateY(-50%); font-size:11px; color:var(--muted)}
.node{position:absolute; transform:translate(-50%,-50%); width:min(27%,100px); min-height:62px; color:var(--text); background:var(--card); border:2px solid var(--edge); border-radius:12px; padding:6px 3px; display:grid; justify-items:center; align-content:center; gap:1px; cursor:default}
.node .ic{font-size:20px; line-height:1.1}
.node .nm{font-size:11px; font-weight:600; line-height:1.2; text-align:center}
.node .hpv{font-size:1rem; color:var(--red); line-height:1}
.node.reach{border-color:var(--ink); cursor:pointer; box-shadow:0 3px 0 var(--ink)}
.node.reach:active{transform:translate(-50%,calc(-50% + 2px)); box-shadow:0 1px 0 var(--ink)}
.node.done{background:var(--hl); color:var(--hlText); border-color:var(--goldEdge)}
.node.done .hpv{color:var(--hlText)}
.node.past{opacity:.35}
.node.past::before{content:""; position:absolute; inset:-2px; border-radius:12px; background:var(--paper); z-index:-1}
.node.boss{width:min(40%,150px)}
details{font-size:.8rem; color:var(--muted); line-height:1.6}
summary{cursor:pointer; color:var(--ink); font-weight:600; font-size:.9rem}
details p{margin:.4em 0}

/* 전투 */
.fight{display:flex; flex-direction:column; gap:12px}
.status{display:grid; gap:6px}
.stage-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.mobname{font-size:1.65rem; color:var(--ink); line-height:1}
.tag{display:inline-block; margin-left:8px; font-size:1rem; color:var(--red); border:2px solid var(--red); border-radius:6px; padding:0 6px; transform:rotate(-6deg)}
.target{font-size:.85rem; color:var(--muted); white-space:nowrap}
.target b{font-family:"Gaegu",cursive; font-size:1.4rem; color:var(--red)}
.bar{height:16px; border:2px solid var(--ink); border-radius:6px; overflow:hidden; background:var(--card)}
.fill{height:100%; background:var(--red); opacity:.85; transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meta{display:flex; gap:12px; font-size:.75rem; color:var(--muted); flex-wrap:wrap}
.meta b{color:var(--text)}
.board{position:relative; border:2px solid var(--ink); border-radius:10px; background:var(--card); padding:10px; display:grid; gap:8px}
.slots{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.slots .card{font-size:26px}
.preview{min-height:26px; font-size:.85rem; color:var(--muted); display:flex; align-items:center}
.preview.ok{font-family:"Gaegu",cursive; font-weight:700; font-size:1.4rem; color:var(--ink)}
.log{height:180px; overflow:auto; border-top:1.5px dashed var(--edge); padding-top:6px; display:flex; flex-direction:column; gap:2px}
.ln{animation:in .25s ease-out}
.ln.info{font-size:.85rem; color:var(--muted)}
.ln.expr{font-family:"Gaegu",cursive; font-weight:700; font-size:1.3rem; color:var(--ink)}
.ln.step{font-family:"Gaegu",cursive; font-size:1.25rem; color:var(--text)}
.ln.step .note{font-family:system-ui,sans-serif; font-size:.7rem; color:var(--red); margin-left:6px}
.ln.fx{font-family:"Gaegu",cursive; font-weight:700; font-size:1.5rem; color:var(--red)}
.ln.fxGold{font-family:"Gaegu",cursive; font-weight:700; font-size:1.25rem; color:var(--text)}
.ln.fxGold span{background:linear-gradient(transparent 50%,var(--hl) 50%,var(--hl) 92%,transparent 92%)}
.ln.miss{font-family:"Gaegu",cursive; font-size:1.2rem; color:var(--muted)}
.ln.final{font-family:"Gaegu",cursive; font-weight:700; font-size:3.4rem; color:var(--red); line-height:1.05; transform:scale(.9); transform-origin:left center}
.ln.final.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp{position:absolute; right:14px; top:36%; font-size:2.5rem; color:var(--red); border:4px solid var(--red); border-radius:10px; padding:0 14px; transform:rotate(-12deg); pointer-events:none; animation:stamp .35s ease-out; background:var(--card)}
.shake{animation:shake .4s}
.shake1{animation:shake1 .3s} .shake2{animation:shake .4s} .shake3{animation:shake3 .5s} .shake4{animation:shake4 .7s}
.actions{display:grid; grid-template-columns:5fr 8fr; gap:10px}
.actions .btn{display:flex; align-items:center; justify-content:center; gap:8px; font-family:"Gaegu",cursive; font-weight:700; font-size:1.4rem; padding:9px 6px; white-space:nowrap}
.tally{display:inline-flex; gap:4px}
.tally svg{width:5px; height:18px; overflow:visible}
.tally path{fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round}
.tally path.used{stroke:rgba(128,128,128,.55)}
.toss{animation:toss .35s ease-in forwards}

/* 부채꼴 손패 */
.hand{position:relative; width:100%; touch-action:none; margin-top:6px}
.hand .empty{position:absolute; inset:0; display:grid; place-items:center; font-size:.8rem; color:var(--muted)}
.hc{position:absolute; left:0; top:0; transform-origin:50% 70%; transition:transform .24s cubic-bezier(.3,1.3,.5,1); will-change:transform; cursor:pointer}
.hc .card{box-shadow:0 3px 0 var(--edge), 0 6px 14px rgba(0,0,0,.1)}
.hc .card.deal{animation:deal .45s cubic-bezier(.3,1.4,.5,1) backwards}
.hc.halo::before{content:""; position:absolute; inset:-5px; border-radius:12px; background:var(--hl); filter:blur(6px); z-index:-1; animation:halo .8s ease-in-out infinite alternate}

/* 상점 */
.shopt{font-size:1.75rem; color:var(--ink); margin:0; line-height:1}
.item{display:flex; gap:12px; align-items:center; background:var(--card); border:2px solid var(--edge); border-radius:10px; padding:8px 10px}
.item.picking{border-color:var(--red)}
.item .card{width:52px; flex:none; font-size:26px}
.item .tx{flex:1; min-width:0}
.item .tx b{display:block; color:var(--ink); font-size:.9rem}
.item .tx small{display:block; color:var(--muted); font-size:.75rem; line-height:1.4}
.buy{flex:none; font-size:.8rem; font-weight:600; padding:8px 10px; border-radius:8px; border:0; background:var(--ink); color:var(--paper); cursor:pointer; white-space:nowrap}
.buy:disabled{opacity:.35; cursor:not-allowed}
.deckgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:6px}
.deckgrid .card{font-size:24px}
.card.dim{opacity:.32; filter:grayscale(1)}

/* 시트 */
.overlay{position:fixed; inset:0; background:var(--scrim); overflow:auto; z-index:20; display:flex; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px)); animation:fade .25s ease-out}
.sheet{margin:auto; width:100%; max-width:460px; background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:22px 22px;
  border:2px solid var(--ink); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px}
.sheet.wide{max-width:820px}
.sheet-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.sheet-head h2{margin:0; font-size:2rem; color:var(--red); line-height:1}
.sub{margin:0; color:var(--muted); font-size:.85rem}
.box{padding:8px 10px; background:var(--card); border:1.5px dashed var(--edge); border-radius:8px; font-size:.8rem}
.gb{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:.75rem}
.gb b{font-family:"Gaegu",cursive; font-size:1.1rem; color:var(--ink)}
.gb.sum{border-top:1px solid var(--edge); padding-top:4px; margin-top:3px; font-weight:600; font-size:.8rem}
.gb.sum b{color:var(--red); font-size:1.4rem}
.offer{display:flex; gap:12px; align-items:center; text-align:left; background:var(--card); border:2px solid var(--edge); border-radius:10px; padding:10px; cursor:pointer; width:100%}
.offer:hover{border-color:var(--ink)}
.offer .vis{width:56px; flex:none}
.offer .card{font-size:26px}
.offer .tx b{display:block; font-size:1rem; color:var(--ink)}
.offer .tx small{display:block; color:var(--muted); font-size:.8rem; margin-top:2px}
.rule{width:56px; height:56px; border:2px solid var(--red); border-radius:50%; display:grid; place-items:center; color:var(--red); font-size:1.05rem; transform:rotate(-8deg)}
.rw{display:flex; flex-direction:column; gap:12px}
.best{display:grid; gap:6px}
.bestrow{display:flex; align-items:center; gap:4px; flex-wrap:wrap}
.bestrow .bc{width:36px}
.bestrow .bd{font-size:6px; padding:0 2px}
.bestrow b{margin-left:6px; font-size:1.5rem; color:var(--red); white-space:nowrap}
.stats{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; align-items:baseline}
.stats dt{color:var(--muted); font-size:.9rem}
.stats dd{margin:0; font-family:"Gaegu",cursive; font-weight:700; font-size:1.4rem; color:var(--ink); line-height:1.1}
.stats.small dd{font-family:inherit; font-size:.8rem; color:var(--text)}
.stats.small dt{font-size:.8rem}
.newrec{color:var(--red); font-size:1.4rem; margin:0}
.legend{margin:0; padding:0; list-style:none; display:grid; gap:5px; font-size:.75rem; color:var(--muted)}
.legend b{color:var(--ink)} .legend b.r{color:var(--red)}
.ach{display:flex; gap:12px; align-items:center; padding:10px; background:var(--card); border:2px solid var(--edge); border-radius:10px}
.ach.got{border-color:var(--ink)}
.ach .ic{flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:1.6rem; background:var(--paper); filter:grayscale(1)}
.ach.got .ic{background:var(--hl); filter:none}
.ach b{display:block; font-size:.95rem; color:var(--muted)}
.ach.got b{color:var(--ink)}
.ach small{display:block; font-size:.8rem; color:var(--muted)}
.ach em{display:block; font-style:normal; font-size:.7rem; color:var(--red)}
.colgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:8px}
.colcell{border:0; background:none; padding:0; cursor:pointer; display:grid; gap:3px}
.colcell .card{font-size:26px}
.colcell .ghostcard{font-family:"Gaegu",cursive; font-size:26px; color:var(--edge)}
.colcell > span{font-size:9px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.progress{height:6px; border-radius:3px; background:var(--edge); overflow:hidden}
.progress div{height:100%; background:var(--red)}
.dialog .sheet{max-width:340px}
.dialog .sheet h3{margin:0; font-size:1.05rem; color:var(--text)}

/* 퍽 */
.perk{display:flex; gap:12px; align-items:center; width:100%; text-align:left; padding:10px; background:var(--card); border:2px solid var(--edge); border-radius:10px; cursor:pointer}
.perk.on{border-color:var(--ink); box-shadow:0 3px 0 var(--ink)}
.perk.locked{cursor:default; opacity:.55}
.perk .ic{flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:1.5rem; background:var(--paper)}
.perk.on .ic{background:var(--hl)}
.perk .tx{flex:1; min-width:0}
.perk b{display:block; font-size:.95rem; color:var(--ink)}
.perk small{display:block; font-size:.78rem; color:var(--muted); line-height:1.4}
.perk em{flex:none; font-style:normal; font-size:.75rem; font-weight:600; color:var(--red)}
.perkbar{display:flex; flex-wrap:wrap; gap:6px}
.perkchip{font-size:.75rem; font-weight:600; color:var(--ink); background:var(--card); border:2px solid var(--ink); border-radius:999px; padding:5px 10px; cursor:pointer}
.perkchip:disabled{opacity:.4; cursor:not-allowed}

/* 소리 버튼과 설정 */
.iconbtn{flex:none; width:32px; height:32px; border:2px solid var(--ink); border-radius:50%; background:var(--card); color:var(--ink); display:grid; place-items:center; cursor:pointer; padding:0; font-size:14px; line-height:1}
.iconbtn.off{opacity:.45}
.menu .iconbtn{position:absolute; right:20px; top:20px}
.menu{position:relative}
.toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:12px; background:var(--card); border:2px solid var(--edge); border-radius:10px; cursor:pointer; text-align:left}
.toggle b{display:block; font-size:.95rem; color:var(--ink)}
.toggle small{display:block; font-size:.75rem; color:var(--muted)}
.switch{flex:none; width:46px; height:26px; border-radius:13px; background:var(--edge); position:relative; transition:background .2s}
.switch::after{content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on .switch{background:var(--ink)}
.toggle.on .switch::after{transform:translateX(20px)}
@media (max-width:400px){ header{gap:6px} header .title{font-size:1.75rem} }

/* 보스 등장 */
.bossintro{position:fixed; inset:0; z-index:30; display:grid; place-items:center; overflow:hidden; animation:bi-fade 2.25s ease forwards; pointer-events:all}
.bossintro::before{content:""; position:absolute; inset:0; background:#0d1430; opacity:.94}
.bossintro .band{position:absolute; left:-10%; right:-10%; transform:skewY(-6deg)}
.bossintro .band.a{top:34%; height:30%; background:#D3302A; animation:bi-left .35s cubic-bezier(.2,.9,.3,1) both}
.bossintro .band.b{top:62%; height:3%; background:#F5E23B; animation:bi-right .35s .08s cubic-bezier(.2,.9,.3,1) both}
.bossintro .q{position:relative; animation:shake4 .7s .62s}
.bossintro .plate{text-align:center; color:#fff; animation:bi-slam .3s .35s cubic-bezier(.3,1.6,.5,1) both}
.bossintro .plate .ic{display:block; font-size:60px; line-height:1.1}
.bossintro .plate b{display:block; font-size:3.2rem; line-height:1.1; text-shadow:0 4px 0 rgba(0,0,0,.35)}
.bossintro .plate small{display:block; margin-top:6px; font-size:.9rem; color:#F5E23B; letter-spacing:.12em}

/* 알림 */
.toasts{position:fixed; bottom:calc(12px + env(safe-area-inset-bottom,0px)); left:0; right:0; display:grid; justify-items:center; gap:6px; z-index:40; pointer-events:none; padding:0 16px}
.toast{display:flex; align-items:center; gap:10px; width:100%; max-width:360px; padding:8px 14px; background:var(--card); border:2px solid var(--ink); border-radius:12px; box-shadow:0 3px 6px rgba(0,0,0,.15); animation:drop .35s cubic-bezier(.3,1.4,.5,1)}
.toast .ic{font-size:1.5rem}
.toast small{display:block; font-size:.7rem; font-weight:600; color:var(--red)}
.toast b{display:block; font-family:"Gaegu",cursive; font-size:1.15rem; color:var(--ink)}

/* 가로 화면 (높이가 좁을 때) */
@media (orientation: landscape) and (max-height: 520px){
  .wrap.fightwide{max-width:1000px; gap:8px; padding-top:16px; padding-bottom:6px}
  .fight.wide{display:grid; grid-template-columns:200px 1fr; gap:14px; align-items:start}
  .fight.wide .left{display:flex; flex-direction:column; gap:12px}
  .fight.wide .right{display:flex; flex-direction:column; gap:8px}
  .fight.wide .meta{flex-direction:column; gap:3px}
  .fight.wide .stage-row{flex-direction:column; align-items:flex-start}
  .fight.wide .board{grid-template-columns:auto 1fr; align-items:start}
  .fight.wide .slots{width:264px}
  .fight.wide .slots .card{font-size:22px}
  .fight.wide .log{height:72px}
  .fight.wide .actions{grid-template-columns:1fr; gap:8px}
  .fight.wide .actions .play{order:-1}
  .fight.wide details{display:none}
}

@keyframes shake4{0%,100%{transform:none}10%{transform:translate(-14px,5px) rotate(-1deg)}22%{transform:translate(13px,-6px) rotate(1deg)}36%{transform:translate(-11px,4px) rotate(-.7deg)}50%{transform:translate(9px,-3px)}65%{transform:translate(-6px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes bi-fade{0%{opacity:0}8%{opacity:1}86%{opacity:1}100%{opacity:0}}

<body>

<div id="overlays"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>/*@SOUNDS@*/</script>
<script>
'use strict';
// ===== 밸런스 조정용 값 (Swift 버전 CFG와 같아요) =====
const CFG = {
  baseHP: 60,                          // 1막 1층 체력
  actGrowth: [1.30, 1.40, 1.50, 1.55], // 막별 층당 체력 배율
  growthAfter: 1.6,                    // 표 이후 막의 층당 배율
  eliteMult: 1.5, bossMult: 1.8,
  midHP: { 4: 1.2, 5: 1.25, 6: 1.3 },  // 중반부(4~6막) 몹 체력 추가 배율. 보상은 그대로라 실제로 어려워져요
  actLen: 10,
  shopRate: 0.22, eliteRate: 0.15,
  hand: 8, plays: 4, discards: 3,
  handPerkRate: 0.12, handMax: 10,     // 손패 +1 특전: 뽑혔을 때 실제로 나올 확률, 손패 상한
  discardPerkRate: 0.25, discardMax: 5, // 버리기 +1 특전: 확률, 상한
  trPerkRate: 0.3,                     // 변신 특전: 뽑혔을 때 실제로 나올 확률 (시뮬레이션으로 맞춰요)
  shopTrRate: 0.35,                    // 상점 숫자 카드가 변신 상태로 나올 확률
  maxLen: 5,
  fireBase: 10, firePow: 0.8,
  luckChance: 0.25,
  stackStep: 4,
  econPow: 1,
  killGold: 5, discGold: 3, playGold: 6,
  goldA: 8, goldK: 0.25, goldCap: 20,
  eliteGoldMult: 1, bossGoldMult: 1,
  powCap: 2,                           // ^ 카드 지수 상한 (같은 카드 두 장을 곱한 만큼까지)
  logAct: 9                            // 이 막부터 로그 단계 (차원 상승)
};
const VERSION = '1.0.0-beta.2';

// Swift의 rounded()처럼 0에서 먼 쪽으로 반올림해요
const rnd = x => Math.sign(x) * Math.round(Math.abs(x));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduceMotion ? Math.min(ms, 60) : ms));

// ===== 카드 구성 요소 =====
const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^' };
const OP_ORDER = '+-/*^';
// 강화할 수 없는 기호 (강력한 대신)
const PLAIN_OPS = ['*', '^'];
const ENH = {
  gold:  { badge: '×2',  name: '황금', desc: '수식에 쓰면 최종 결과 ×2', value: 18 },
  fire:  { badge: '+',   name: '불꽃', desc: '수식에 쓰면 최종 결과에 더해요. 적 체력과 함께 커져요', value: 8 },
  luck:  { badge: '?×5', name: '행운', desc: '수식에 쓰면 25% 확률로 최종 결과 ×5', value: 12 },
  amp:   { badge: '증폭', name: '증폭', desc: '오른쪽 수를 세 배로 더해요', value: 15, op: '+' },
  stack: { badge: '적립', name: '적립', desc: `보너스를 함께 더하고, 쓸 때마다 보너스가 ${CFG.stackStep}×물가만큼 영구히 커져요`, value: 15, op: '+' },
  flip:  { badge: '역전', name: '역전', desc: '빼서 음수가 되면 빼는 대신 두 수를 더하고 ×4', value: 15, op: '-' },
  exact: { badge: '정확', name: '정확', desc: '나누어떨어지면 나누는 대신 두 수를 곱하고 ×2', value: 16, op: '/' }
};
const ENH_KEYS = Object.keys(ENH);
const OP_PERKS = ['amp', 'stack', 'flip', 'exact'];
const isOpPerk = e => OP_PERKS.includes(e);
// 정확 강화가 발동하는 나눗셈 (0은 나눠도 0이라 빼요)
const divides = (a, b) => a !== 0 && b !== 0 && Math.abs(a % b) < 1e-9;

function fact(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
const superfact = n => { let r = 1; for (let k = 1; k <= n; k++) r *= fact(k); return r; };
const hyperfact = n => { let r = 1; for (let k = 1; k <= n; k++) r *= Math.pow(k, k); return r; };
const tetra3 = n => { let r = 1; for (let k = 0; k < n; k++) r = Math.pow(3, r); return r; };
// 숫자 변신 강화. 막마다 하나씩 해금. cap은 변신에 넣는 값의 상한. special은 보스 보상으로만 나와요
const TR = [
  { key: 'sq',    name: '제곱',          act: 2, cap: 20, value: 14, f: n => n * n,                 txt: v => `${v}²`,     face: v => `${v}<sup>2</sup>` },
  { key: 'pow2',  name: '2의 거듭제곱',  act: 3, cap: 15, value: 22, f: n => Math.pow(2, n),        txt: v => `2^${v}`,    face: v => `2<sup>${v}</sup>` },
  { key: 'exp',   name: '자연지수',      act: 4, cap: 12, value: 32, f: n => rnd(Math.exp(n)),      txt: v => `e^${v}`,    face: v => `e<sup>${v}</sup>` },
  { key: 'fact',  name: '팩토리얼',      act: 5, cap: 10, value: 44, f: n => fact(Math.max(1, n)),  txt: v => `${v}!`,     face: v => `${v}!` },
  { key: 'self',  name: '자기거듭제곱',  act: 6, cap: 9,  value: 56, f: n => Math.pow(n, n),        txt: v => `${v}^${v}`, face: v => `${v}<sup>${v}</sup>` },
  { key: 'sfact', name: '슈퍼팩토리얼',  act: 7, cap: 7,  value: 70, f: n => superfact(n),          txt: v => `sf(${v})`,  face: v => `sf<small>(${v})</small>` },
  { key: 'hfact', name: '하이퍼팩토리얼', act: 8, cap: 6,  value: 85, f: n => hyperfact(n),          txt: v => `H(${v})`,   face: v => `H<small>(${v})</small>` },
  { key: 'tet',   name: '테트레이션',    act: 8, cap: 3,  value: 60, f: n => tetra3(n), special: true, txt: v => `3↑↑${v}`, face: v => `3<small>↑↑</small>${v}` }
];

// ===== 큰 수 =====
// 1e300을 넘으면 log₁₀로 들고 다녀서 무한대가 되지 않아요. 작은 수는 그대로 계산해 1~8막은 정확해요.
const BIG = 1e300;
const N = {
  of: v => ({ s: Math.sign(v), v, l: null }),
  fromLog: (s, l) => s === 0 ? N.of(0) : l < 300 ? N.of(s * Math.pow(10, l)) : { s, v: null, l },
  // |x|의 자릿수 (log₁₀|x|)
  log: x => x.v !== null ? Math.log10(Math.abs(x.v)) : x.l,
  small: x => x.v !== null,
  num: x => x.v !== null ? x.v : x.s * Infinity,
  neg: x => x.v !== null ? N.of(-x.v) : { s: -x.s, v: null, l: x.l },
  add(a, b) {
    if (a.s === 0) return b;
    if (b.s === 0) return a;
    if (N.small(a) && N.small(b) && Math.abs(a.v + b.v) < BIG) return N.of(a.v + b.v);
    const la = N.log(a), lb = N.log(b);
    const [hi, lo, sh] = la >= lb ? [la, lb, a.s] : [lb, la, b.s];
    if (a.s === b.s) return N.fromLog(sh, hi + Math.log10(1 + Math.pow(10, lo - hi)));
    if (hi - lo < 1e-12) return N.of(0);
    return N.fromLog(sh, hi + Math.log10(1 - Math.pow(10, lo - hi)));
  },
  sub: (a, b) => N.add(a, N.neg(b)),
  mul(a, b) {
    if (a.s === 0 || b.s === 0) return N.of(0);
    if (N.small(a) && N.small(b) && Math.abs(a.v * b.v) < BIG) return N.of(a.v * b.v);
    return N.fromLog(a.s * b.s, N.log(a) + N.log(b));
  },
  div(a, b) {
    if (b.s === 0 || a.s === 0) return N.of(0);
    if (N.small(a) && N.small(b) && Math.abs(a.v / b.v) < BIG) return N.of(a.v / b.v);
    return N.fromLog(a.s * b.s, N.log(a) - N.log(b));
  },
  // a^b. 지수는 ±powCap에서 멈춰요. 음수 밑은 지수가 홀수 정수일 때만 음수가 돼요
  pow(a, b) {
    const e = Math.max(-CFG.powCap, Math.min(CFG.powCap, N.num(b)));
    if (a.s === 0) return N.of(0);
    const sign = a.s < 0 && Number.isInteger(e) && Math.abs(e) % 2 === 1 ? -1 : 1;
    if (N.small(a)) {
      const r = Math.pow(Math.abs(a.v), e);
      if (isFinite(r) && r < BIG) return N.of(sign * r);
    }
    return N.fromLog(sign, e * N.log(a));
  },
  // 두 수가 정확히 나누어떨어지는지 (아주 큰 수는 확인할 수 없어 아니라고 봐요)
  divides: (a, b) => N.small(a) && N.small(b) && Math.abs(a.v) < 1e15 && Math.abs(b.v) < 1e15 && divides(a.v, b.v),
  fmt(x) {
    if (x.v !== null) return fmt(x.v);
    const e = Math.floor(x.l);
    return `${(x.s * Math.pow(10, x.l - e)).toFixed(2)}×10^${e < 1e15 ? e.toLocaleString('ko-KR') : fmt(e)}`;
  }
};
const trOf = c => c.tr ? TR.find(t => t.key === c.tr) : null;
const trIndex = c => c.tr ? TR.findIndex(t => t.key === c.tr) : -1;
const LADDER = TR.filter(t => !t.special);
// 변신에 실제로 들어가는 n (상한에서 멈춰요)
const trInput = c => { const t = trOf(c); return t ? Math.min(c.v, t.cap) : c.v; };
const numVal = c => { const t = trOf(c); return t ? t.f(trInput(c)) : c.v; };
const faceText = c => c.kind === 'op' ? SYM[c.op] : (trOf(c) ? trOf(c).txt(trInput(c)) : String(c.v));
const cardLabel = c => c.kind === 'num' ? `숫자 ${faceText(c)}` : `${SYM[c.op]} 카드`;
function baseValue(c) {
  let v = c.kind === 'num' ? 6 + c.v : ({ '*': 30, '/': 12, '^': 45 }[c.op] || 10);
  c.enh.forEach(e => v += ENH[e].value);
  const t = trOf(c); if (t) v += t.value;
  return v;
}
const numberCard = (id, v) => ({ id, kind: 'num', v, op: null, enh: [], up: 0, tr: null, bonus: 0 });
const symbolCard = (id, op) => ({ id, kind: 'op', v: 0, op, enh: [], up: 0, tr: null, bonus: 0 });

// ===== 퍽 (판 밖에서 해금해 3개까지 장착) =====
// 밸런스 기준: 막마다 상점을 한 번 공짜로 재입고하는 정도의 이득
const PERK_SLOTS = 3;
const PERKS = [
  { key: 'restock',   icon: '🔄', name: '재입고',     depth: 3,  desc: '상점에서 막마다 한 번 무료로 물건을 새로 들여요' },
  { key: 'allowance', icon: '👛', name: '비상금',     depth: 6,  desc: '막을 시작할 때 골드를 받아요 (물가 ×12)' },
  { key: 'coupon',    icon: '🎟️', name: '할인권',     depth: 10, desc: '막마다 상점 첫 구매가 30% 싸요' },
  { key: 'reroll',    icon: '🎲', name: '다시 뽑기',  depth: 13, desc: '막마다 한 번 특전 선택지를 새로 뽑아요' },
  { key: 'sharpen',   icon: '✏️', name: '연필 깎기',  depth: 16, desc: '막마다 한 번 전투 중 손패를 모두 새로 뽑아요 (버리기를 쓰지 않아요)' },
  { key: 'study',     icon: '📖', name: '예습',       depth: 20, desc: '전투 첫 손패에 숫자 카드가 4장 이상 들어와요' },
  { key: 'interest',  icon: '🏦', name: '이자',       depth: 25, desc: '상점을 나갈 때 남은 골드의 10%를 받아요 (최대 물가 ×10)' },
  { key: 'clover',    icon: '🍀', name: '네잎클로버', depth: 30, desc: '행운 강화가 터질 확률이 25%에서 35%로 올라요' },
  { key: 'hunter',    icon: '🏹', name: '정예 사냥꾼', depth: 40, desc: '정예를 잡으면 특전 선택지가 4개씩 나와요' },
  { key: 'grit',      icon: '💪', name: '뒷심',       depth: 50, desc: '막마다 한 번, 계산 기회를 다 썼을 때 체력이 20% 이하로 남았으면 한 번 더 계산해요' }
];
const perkOf = k => PERKS.find(p => p.key === k);
const depthText = d => `${Math.ceil(d / CFG.actLen)}막 ${(d - 1) % CFG.actLen + 1}층`;

// ===== 지도 =====
const NODE = {
  mob:   { icon: '👾', name: '몹' },
  elite: { icon: '💀', name: '정예' },
  shop:  { icon: '🛒', name: '상점' },
  boss:  { icon: '👑', name: '보스' }
};
const MOBS = {
  mob: ['계산 슬라임', '나머지 고블린', '분모 박쥐', '소수점 쥐', '괄호 거미', '오답 유령', '반올림 두더지', '약수 버섯'],
  elite: ['구구단 기사', '약분 마법사', '통분 쌍둥이', '검산 감시자'],
  boss: ['방정식 골렘', '무한소 군주', '미지수 용', '증명 거인']
};

// ===== 숫자 표시: 만·억·조·경 단위로 짧게 =====
const UNITS = [[1e16, '경'], [1e12, '조'], [1e8, '억'], [1e4, '만']];
const grouped = n => n.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const a = Math.abs(n);
  if (a < 1e5) return grouped(rnd(n * 100) / 100);
  if (a >= 1e20) {
    const e = Math.floor(Math.log10(a));
    return `${(n / Math.pow(10, e)).toFixed(2)}×10^${e}`;
  }
  for (const [u, name] of UNITS) if (a >= u) {
    const x = n / u;
    const factor = Math.pow(10, 3 - (Math.floor(Math.log10(Math.abs(x))) + 1));
    return grouped(rnd(x * factor) / factor) + name;
  }
  return grouped(n);
}

// ===== 한 판 상태와 공식 =====
function newRun() {
  return {
    act: 1, map: [], floor: 0, curID: null, visited: [], depth: 1, deck: [], gold: 0, goldTotal: 0, kills: 0,
    hand: CFG.hand, plays: CFG.plays, discards: CFG.discards, bestPlay: 0, nextID: 0, phase: 'map', mapMsg: '',
    fight: null, shop: null, reward: null, lastGold: null, over: null, startedAt: Date.now(),
    perks: [],      // 이번 판에 장착한 퍽 (시작할 때 정해져요)
    perkUsed: {}    // 막마다 한 번 쓰는 퍽: 마지막으로 쓴 막
  };
}
const growthOf = act => act - 1 < CFG.actGrowth.length ? CFG.actGrowth[act - 1] : CFG.growthAfter;
function baseHPAt(depth) {
  let h = CFG.baseHP;
  for (let d = 2; d <= depth; d++) h *= growthOf(Math.ceil(d / CFG.actLen));
  return h;
}
const R = {
  depthOf: (run, f) => (run.act - 1) * CFG.actLen + f,
  // 로그 단계(차원 상승 뒤)에서는 체력·물가 사다리를 1막부터 다시 올라요
  isLog: run => run.act >= CFG.logAct,
  ladderDepth: (run, f) => R.isLog(run) ? (run.act - CFG.logAct) * CFG.actLen + f : R.depthOf(run, f),
  econ: (run, f = run.floor) => Math.pow(baseHPAt(R.ladderDepth(run, Math.max(1, f))) / CFG.baseHP, CFG.econPow),
  hpFor(run, f, type) {
    let h = baseHPAt(R.ladderDepth(run, Math.max(1, f)));
    if (type === 'elite') h *= CFG.eliteMult;
    if (type === 'boss') h *= CFG.bossMult;
    if (!R.isLog(run)) h *= CFG.midHP[run.act] || 1;
    return rnd(h / 10) * 10;
  },
  fireBonus: run => rnd(CFG.fireBase * Math.pow(R.econ(run), CFG.firePow)),
  leftoverRate: run => ({ play: rnd(CFG.playGold * R.econ(run)), disc: rnd(CFG.discGold * R.econ(run)) }),
  card: (run, id) => run.deck.find(c => c.id === id),
  node: (run, id) => id == null ? null : run.map.flat().find(n => n.id === id),
  reachable(run, n) { const cur = R.node(run, run.curID); return cur ? cur.next.includes(n.id) : n.floor === 1; },
  unlockedTR: run => LADDER.filter(t => run.act >= t.act),
  actName: run => R.isLog(run) ? `로그 ${run.act - CFG.logAct + 1}막` : `${run.act}막`,
  whereText: run => run.floor === 0 ? `${R.actName(run)} 출발` : `${R.actName(run)} ${run.floor}층`,
  // 로그 단계의 체력은 10의 거듭제곱, 피해는 자릿수예요
  hpText: (run, x) => R.isLog(run) ? `10^${fmt(x)}` : fmt(x),
  dmgText: (run, x) => R.isLog(run) ? `${fmt(x)}자리` : fmt(x),
  hasPerk: (run, k) => (run.perks || []).includes(k),
  perkReady: (run, k) => R.hasPerk(run, k) && (run.perkUsed || {})[k] !== run.act
};
const hpUnit = (hp, type) => Math.pow(hp / CFG.baseHP, CFG.econPow) * (type === 'elite' ? CFG.eliteGoldMult : type === 'boss' ? CFG.bossGoldMult : 1);
const overkillCap = (hp, type) => CFG.goldCap * hpUnit(hp, type);
// 초과 피해 → 골드: 로그로 빠르게 꺾이고 상한에서 멈춰요
const overkillGold = (over, hp, type) => rnd(Math.min(CFG.goldCap, CFG.goldA * Math.log(1 + (over / hp) / CFG.goldK)) * hpUnit(hp, type));

// ===== 카드 도감 =====
const CATALOG = (() => {
  const list = [];
  for (let n = 1; n <= 15; n++) list.push({ key: `num-${n}`, title: `숫자 ${n}`, desc: n <= 9 ? '기본 덱에 들어 있는 숫자예요' : '상점이나 강화로 얻는 큰 숫자예요', sample: numberCard(-n, n) });
  const opDesc = { '*': '강력한 대신 강화할 수 없어요', '^': `× 카드가 진화한 거듭제곱 카드예요. 지수는 ${CFG.powCap}까지 (6막부터)` };
  ['+', '-', '*', '/', '^'].forEach((op, i) => list.push({ key: `op-${op}`, title: `${SYM[op]} 카드`, desc: opDesc[op] || '기본 기호 카드예요', sample: symbolCard(-100 - i, op) }));
  ENH_KEYS.forEach((e, i) => {
    const s = isOpPerk(e) ? symbolCard(-200 - i, ENH[e].op) : numberCard(-200 - i, 7);
    s.enh = [e];
    if (e === 'stack') s.bonus = CFG.stackStep;
    list.push({ key: `enh-${e}`, title: `${ENH[e].name} 강화${ENH[e].op ? ` (${SYM[ENH[e].op]} 카드)` : ''}`, desc: ENH[e].desc, sample: s });
  });
  TR.forEach((t, i) => {
    const s = numberCard(-300 - i, 5); s.tr = t.key;
    const when = t.special ? `${t.act}막부터 보스를 잡으면 나와요` : `${t.act}막부터 나와요`;
    list.push({ key: `tr-${t.key}`, title: `${t.name} 변신`, desc: `${when}. 숫자 n을 ${t.txt('n')}으로 계산해요 (n은 ${t.cap}까지)`, sample: s });
  });
  return list;
})();
const CATALOG_KEYS = new Set(CATALOG.map(e => e.key));
function catalogKeys(c) {
  const keys = [];
  if (c.kind === 'num' && c.v >= 1 && c.v <= 15) keys.push(`num-${c.v}`);
  if (c.op) keys.push(`op-${c.op}`);
  c.enh.forEach(e => keys.push(`enh-${e}`));
  if (c.tr) keys.push(`tr-${c.tr}`);
  return keys;
}
const collectionCount = p => p.collection.filter(k => CATALOG_KEYS.has(k)).length;

  ['collectHalf', '🗂️', '수집가', '카드 도감 절반 채우기', p => collectionCount(p) / CATALOG.length >= 0.5],

].map(([id, icon, title, desc, isMet]) => ({ id, icon, title, desc, isMet }));

// ===== 저장 슬롯 3개 (localStorage) =====
const SLOT_COUNT = 3;
function newProfile() {
  return {
    run: null, bestDepth: 0, bestSingle: 0,
    stats: { runsStarted: 0, runsFinished: 0, kills: 0, eliteKills: 0, bossKills: 0, maxAct: 1, maxHit: 0, maxGold: 0, oneShots: 0, bigOverkills: 0, luckProcs: 0, cardsBought: 0, maxDepth: 0 },
    achievements: {}, collection: [], createdAt: Date.now(), updatedAt: Date.now(),
    perksUnlocked: [], equipped: []
  };
}
const Store = {
  slots: [],
  key: i => `sempan-slot${i + 1}`,
  load() {
    for (let i = 0; i < SLOT_COUNT; i++) {
      try {
        const raw = localStorage.getItem(this.key(i));
        if (!raw) { this.slots[i] = null; continue; }
        const p = Object.assign(newProfile(), JSON.parse(raw));
        // 예전 저장에 없는 기록 항목은 기본값으로 채워요
        p.stats = Object.assign(newProfile().stats, p.stats);
        if (!p.stats.maxDepth) p.stats.maxDepth = Math.max(p.bestDepth || 0, p.run ? p.run.depth : 0);
        // 예전 기록으로 이미 도달한 깊이의 퍽은 불러올 때 바로 해금해요
        evaluatePerks(p);
        this.slots[i] = p;
      } catch (e) { this.slots[i] = null; }
    }
  },
  profile(i) { return this.slots[i] || newProfile(); },
  update(i, change) {
    const p = this.profile(i);
    change(p);
    p.updatedAt = Date.now();
    this.slots[i] = p;
    try { localStorage.setItem(this.key(i), JSON.stringify(p)); } catch (e) { console.warn('저장 실패', e); }
  },
  delete(i) {
    this.slots[i] = null;
    try { localStorage.removeItem(this.key(i)); } catch (e) {}
  }
};
// 새로 해금한 퍽을 기록하고 돌려줘요
function evaluatePerks(p) {
  const out = PERKS.filter(k => p.stats.maxDepth >= k.depth && !p.perksUnlocked.includes(k.key));
  out.forEach(k => p.perksUnlocked.push(k.key));
  return out;
}

// 새로 달성한 업적을 기록하고 돌려줘요
function evaluateAchievements(p) {
  const out = [];
  for (const a of ACHIEVEMENTS) if (!p.achievements[a.id] && a.isMet(p)) { p.achievements[a.id] = Date.now(); out.push(a); }
  return out;
}

// ===== 소리 =====
// 소리 파일은 web/build.py가 window.SOUND_DATA(base64 WAV)로 넣어요. 없으면 조용히 넘어가요.
const Sound = (() => {
  let ctx = null, sfxBus = null, musicBus = null, bgm = null, loading = null, lastSwish = 0;
  const buffers = {};
  const MUSIC_VOL = 0.32;
  const pref = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v === '1'; } catch (e) { return d; } };
  const state = { music: pref('sempan-music', true), sfx: pref('sempan-sfx', true) };
  const save = () => { try { localStorage.setItem('sempan-music', state.music ? '1' : '0'); localStorage.setItem('sempan-sfx', state.sfx ? '1' : '0'); } catch (e) {} };
  const bytes = b64 => { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a.buffer; };

  // 브라우저는 사용자가 한 번 누른 뒤에야 소리를 내게 해줘요
  function unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !window.SOUND_DATA) return;
    if (!ctx) {
      ctx = new AC();
      sfxBus = ctx.createGain(); sfxBus.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0; musicBus.connect(ctx.destination);
      loading = Promise.all(Object.entries(window.SOUND_DATA).map(([k, v]) =>
        new Promise(res => ctx.decodeAudioData(bytes(v), b => { buffers[k] = b; res(); }, () => res()))))
        .then(() => { if (state.music) startMusic(); });
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume();
  }

  function play(name, opts = {}) {
    if (!ctx || !state.sfx || !buffers[name] || ctx.state !== 'running') return;
    const src = ctx.createBufferSource();
    src.buffer = buffers[name];
    src.playbackRate.value = opts.rate || 1;
    const g = ctx.createGain();
    g.gain.value = opts.vol ?? 1;
    src.connect(g); g.connect(sfxBus);
    src.start();
  }

  function startMusic() {
    if (!ctx || bgm || !buffers.bgm) return;
    bgm = ctx.createBufferSource();
    bgm.buffer = buffers.bgm;
    bgm.loop = true;
    bgm.connect(musicBus);
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(MUSIC_VOL, ctx.currentTime + 1.5);
    bgm.start();
  }
  function stopMusic() {
    if (!bgm) return;
    const old = bgm; bgm = null;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(musicBus.gain.value, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
    setTimeout(() => { try { old.stop(); old.disconnect(); } catch (e) {} }, 450);
  }

  return {
    state, unlock, play,
    get ready() { return !!ctx && Object.keys(buffers).length > 0; },
    // 카드를 훑을 때: 너무 자주 겹치지 않게 하고 음높이를 조금씩 바꿔요
    swish() { const now = performance.now(); if (now - lastSwish < 60) return; lastSwish = now; play('swish', { rate: 0.92 + Math.random() * 0.16, vol: 0.6 }); },
    // 피해 크기(적 체력 대비)에 따라 1~4단계. 화면 흔들림도 같은 단계를 써요
    hitLevel: (dmg, hp) => dmg <= 0 ? 0 : dmg < hp * 0.15 ? 1 : dmg < hp * 0.4 ? 2 : dmg < hp ? 3 : 4,
    toggle(kind) {
      state[kind] = !state[kind]; save();
      if (kind === 'music') { if (state.music) { unlock(); if (loading) loading.then(startMusic); } else stopMusic(); }
    },
    pause() { if (ctx && ctx.state === 'running') ctx.suspend(); },
    resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  };
})();
['pointerdown', 'keydown', 'click'].forEach(t => document.addEventListener(t, Sound.unlock, true));
document.addEventListener('visibilitychange', () => document.hidden ? Sound.pause() : Sound.resume());
// 안드로이드 앱이 백그라운드로 갈 때 불러요
window.sempanPause = () => Sound.pause();
window.sempanResume = () => Sound.resume();

// ===== 게임 진행 =====
let G = null; // 지금 열린 게임 (없으면 메인 화면)
const ui = { sheet: null, confirm: null, info: '', selectedSlot: 0 };
try { ui.selectedSlot = Math.min(SLOT_COUNT - 1, +localStorage.getItem('sempan-selectedSlot') || 0); } catch (e) {}

class Game {
  constructor(slot) {
    this.slot = slot;
    this.busy = false;
    this.tossing = false;
    this.showStamp = false;
    this.finalPop = false;
    this.previewOverride = null;
    this.freshIDs = new Set();
    // 이미 저장했지만 계산 연출이 끝날 때까지 체력 막대에 숨겨 두는 피해
    this.hiddenDamage = 0;
    const saved = Store.profile(slot).run;
    if (saved) {
      this.run = JSON.parse(JSON.stringify(saved));
      // 계산 연출 도중에 앱이 꺼졌다면 저장된 결과로 승패를 마저 정해요
      if (this.run.fight && this.run.fight.resolving && !this.run.reward) this.finish(this.settle());
    } else {
      this.run = newRun();
      this.newGame();
    }
  }

  get profile() { return Store.profile(this.slot); }

  updateProfile(change) {
    let unlocked = [], perks = [];
    Store.update(this.slot, p => { change(p); unlocked = evaluateAchievements(p); perks = evaluatePerks(p); });
    unlocked.forEach(a => pushToast(a.icon, '업적 달성!', a.title));
    // 한꺼번에 여럿 풀리면 (예전 기록으로 처음 열 때) 알림 하나로 묶어요
    if (perks.length > 2) pushToast('🎒', '퍽 해금! 메인 화면에서 장착해요', `${perks.map(k => k.name).slice(0, 3).join(', ')} 외 ${perks.length - 3}개`);
    else perks.forEach(k => pushToast(k.icon, '퍽 해금! 메인 화면에서 장착해요', k.name));
    if (unlocked.length || perks.length) Sound.play('fanfare');
  }

  // ----- 퍽 -----
  usePerk(k) { this.run.perkUsed[k] = this.run.act; }

  // 막을 시작할 때 (1막 포함)
  actStart() {
    if (!R.hasPerk(this.run, 'allowance')) return '';
    const g = rnd(12 * R.econ(this.run, 1));
    this.run.gold += g;
    this.run.goldTotal += g;
    return ` 비상금 +${fmt(g)}골드.`;
  }

  // 진행 중인 판을 슬롯에 저장해요
  save() {
    if (this.run.over) return;
    const snapshot = JSON.parse(JSON.stringify(this.run));
    this.updateProfile(p => {
      p.run = snapshot;
      p.stats.maxGold = Math.max(p.stats.maxGold, snapshot.gold);
      p.stats.maxAct = Math.max(p.stats.maxAct, snapshot.act);
      p.stats.maxDepth = Math.max(p.stats.maxDepth || 0, snapshot.depth);
    });
  }

  collect(cards, silent = false) {
    const fresh = [];
    this.updateProfile(p => {
      const have = new Set(p.collection);
      cards.forEach(c => catalogKeys(c).forEach(k => { if (!have.has(k)) { have.add(k); fresh.push(k); } }));
      p.collection = [...have];
    });
    if (silent) return;
    fresh.forEach(k => { const e = CATALOG.find(x => x.key === k); if (e) pushToast('🃏', '도감 등록', e.title); });
    if (fresh.length) Sound.play('chime', { vol: 0.8 });
  }

  // ----- 시작과 끝 -----
  mk(kind, x) {
    const id = this.run.nextID++;
    return kind === 'num' ? numberCard(id, x) : symbolCard(id, x);
  }

  newDeck() {
    const d = [];
    for (let r = 0; r < 2; r++) for (let n = 1; n <= 9; n++) d.push(this.mk('num', n));
    [['+', 4], ['-', 3], ['/', 3], ['*', 2]].forEach(([o, c]) => { for (let i = 0; i < c; i++) d.push(this.mk('op', o)); });
    return d;
  }

  newGame() {
    this.run = newRun();
    this.busy = false;
    this.run.deck = this.newDeck();
    this.run.map = this.genAct();
    const p = this.profile;
    // 장착한 퍽은 판을 시작할 때 정해져요
    this.run.perks = (p.equipped || []).filter(k => (p.perksUnlocked || []).includes(k)).slice(0, PERK_SLOTS);
    this.run.mapMsg = (p.bestDepth > 0 ? `역대 기록: ${p.bestDepth}층까지, 한 방 ${fmt(p.bestSingle)}.` : '1층에서 출발할 칸을 고르세요.') + this.actStart();
    this.updateProfile(p => p.stats.runsStarted++);
    this.collect(this.run.deck, true);
    this.save();
  }

  gameOver(reason) {
    this.busy = true;
    let rec = false;
    const run = this.run;
    this.updateProfile(p => {
      if (run.depth > p.bestDepth) { p.bestDepth = run.depth; rec = true; }
      if (run.bestPlay > p.bestSingle) { p.bestSingle = run.bestPlay; rec = true; }
      p.stats.runsFinished++;
      p.stats.maxAct = Math.max(p.stats.maxAct, run.act);
      // 끝난 판은 슬롯에서 지워요 (기록과 업적은 남아요)
      p.run = null;
    });
    run.over = { reason, newRecord: rec };
  }

  // ----- 길 생성 -----
  genAct() {
    const floors = [];
    for (let f = 1; f <= CFG.actLen; f++) {
      let n;
      if (f === CFG.actLen) n = 1;
      else if (f === 1) n = 2 + Math.floor(Math.random() * 2);
      else { const r = Math.random(); n = r < 0.2 ? 1 : r < 0.65 ? 2 : 3; }
      const row = [];
      for (let i = 0; i < n; i++) {
        const jit = (Math.random() - 0.5) * 8;
        const x = n === 1 ? 52 + jit : 20 + 64 * (i / (n - 1)) + jit;
        let type = 'mob';
        if (f === CFG.actLen) type = 'boss';
        else if (f > 1) { const r = Math.random(); type = r < CFG.shopRate ? 'shop' : r < CFG.shopRate + CFG.eliteRate ? 'elite' : 'mob'; }
        if (f === CFG.actLen - 1 && type === 'elite') type = 'mob';
        row.push({ id: `${f}-${i}`, floor: f, x, type, next: [], name: '' });
      }
      floors.push(row);
    }
    // 이웃 층끼리 교차하지 않는 길로 잇기 (모든 칸에 들어오고 나가는 길이 하나 이상)
    for (let f = 0; f < floors.length - 1; f++) {
      const a = floors[f], b = floors[f + 1];
      let i = 0, j = 0;
      const link = () => { if (!a[i].next.includes(b[j].id)) a[i].next.push(b[j].id); };
      link();
      while (i < a.length - 1 || j < b.length - 1) {
        const r = Math.random(), ci = i < a.length - 1, cj = j < b.length - 1;
        if (ci && cj && r < 0.3) { i++; j++; }
        else if (ci && (!cj || r < 0.65)) i++;
        else j++;
        link();
      }
    }
    const at = (f, id) => floors[f].find(m => m.id === id);
    // 상점에서 나가는 길이 모두 상점이면 상점에 연달아 들어가야 해요. 그중 하나를 몹으로 바꿔요
    floors.forEach((row, f) => row.forEach(n => {
      if (n.type !== 'shop' || f + 1 >= floors.length) return;
      const nexts = n.next.map(id => at(f + 1, id));
      if (nexts.every(m => m.type === 'shop')) pick(nexts).type = 'mob';
    }));
    // 막마다 상점 하나는 보장 (상점이 연달아 강제되지 않는 칸에만 놓아요)
    const midIdx = Array.from({ length: CFG.actLen - 3 }, (_, k) => k + 2);
    if (!midIdx.some(f => floors[f].some(n => n.type === 'shop'))) {
      const safe = [];
      midIdx.forEach(f => floors[f].forEach(x => {
        const exitsAllShop = x.next.every(id => at(f + 1, id).type === 'shop');
        const forcesParent = floors[f - 1].some(p => p.type === 'shop' && p.next.includes(x.id) && p.next.every(id => id === x.id || at(f, id).type === 'shop'));
        if (!exitsAllShop && !forcesParent) safe.push(x);
      }));
      if (safe.length) pick(safe).type = 'shop';
    }
    floors.flat().forEach(n => { n.name = n.type === 'shop' ? '상점' : pick(MOBS[n.type]); });
    return floors;
  }

  // ----- 지도 -----
  async enterNode(n) {
    if (!R.reachable(this.run, n) || this.busy) return;
    if (n.type === 'boss') {
      // 보스 앞: 화면이 어두워지며 이름판이 꽂히고 무거운 종이 울려요
      await this.showIntro({ icon: '👑', title: n.name, sub: `${R.actName(this.run)} 보스 · 체력 ${R.hpText(this.run, R.hpFor(this.run, n.floor, 'boss'))}` });
    }
    this.run.curID = n.id;
    this.run.visited.push(n.id);
    this.run.floor = n.floor;
    this.run.depth = R.depthOf(this.run, n.floor);
    if (n.type === 'shop') this.openShop(); else this.startFight(n);
  }

  // 화면을 덮는 등장 장면 (보스, 차원 상승)
  async showIntro(intro) {
    this.busy = true;
    this.intro = intro;
    paint();
    await wait(350);
    Sound.play('bell');
    await wait(1900);
    this.intro = null;
    this.busy = false;
  }

  afterNode(message) {
    let msg = message;
    const run = this.run;
    if (run.floor >= CFG.actLen) {
      // 차원 상승: 골드와 적립 보너스를 새 단위로 바꿔요 (물가가 1로 돌아가요)
      const ascending = run.act + 1 === CFG.logAct;
      const oldEcon = R.econ(run, CFG.actLen);
      run.act++;
      run.map = this.genAct();
      run.floor = 0;
      run.curID = null;
      run.visited = [];
      if (ascending) {
        run.gold = rnd(run.gold / oldEcon);
        run.deck.forEach(c => { if (c.enh.includes('stack')) c.bonus = Math.max(CFG.stackStep, rnd(c.bonus / oldEcon)); });
        msg += ' 차원 상승! 이제 체력은 10의 거듭제곱이고, 계산 결과의 자릿수(log₁₀)만큼 깎여요. 골드도 새 단위로 바뀌었어요.';
        this.showIntro({ icon: '🌌', title: '차원 상승', sub: '로그 단계 · 결과의 자릿수가 피해가 돼요' }).then(paint);
      } else {
        msg += ` ${R.actName(run)}이 시작됐어요.`;
      }
      const t = LADDER.find(t => t.act === run.act);
      if (t) msg += ` 이제 ${t.name} 변신 강화가 나와요.`;
      if (run.act === 6) msg += ' 이제 × 카드를 ^ 카드로 진화시킬 수 있어요.';
      if (run.act === 8) msg += ' 이번 막 보스부터 테트레이션 카드를 줘요.';
      msg += this.actStart();
    }
    run.mapMsg = msg;
    run.fight = null;
    run.shop = null;
    run.phase = 'map';
    this.save();
  }

  // ----- 전투 -----
  startFight(node) {
    const run = this.run;
    const nums = shuffle(run.deck.filter(c => c.kind === 'num').map(c => c.id));
    const ops = shuffle(run.deck.filter(c => c.kind === 'op').map(c => c.id));
    const rate = R.leftoverRate(run);
    const f = { nodeID: node.id, hpMax: R.hpFor(run, run.floor, node.type), score: 0, playsLeft: run.plays, discLeft: run.discards,
      numDraw: nums, opDraw: ops, numPile: [], opPile: [], handCards: [], sel: [], log: [], resolving: false };
    const logRule = R.isLog(run) ? ' 로그 단계라서 계산 결과의 자릿수(log₁₀)만큼 체력의 지수가 깎여요.' : '';
    f.log = [{ id: uid(), text: `${node.name}이(가) 나타났어요. ${run.plays}번 안에 체력 ${R.hpText(run, f.hpMax)}을 깎으세요.${logRule} 이기면 남은 계산 1번당 ${fmt(rate.play)}골드, 버리기 1번당 ${fmt(rate.disc)}골드를 받아요.`, note: '', style: 'info' }];
    run.fight = f;
    run.phase = 'fight';
    this.refill();
    if (R.hasPerk(run, 'study')) this.ensureNumbers(4);
    this.save();
    this.checkStuck();
  }

  get fightNode() { return this.run.fight ? R.node(this.run, this.run.fight.nodeID) : null; }

  // 예습: 첫 손패의 기호 카드를 숫자 덱의 카드와 바꿔 숫자를 n장 이상으로 맞춰요
  ensureNumbers(n) {
    const f = this.run.fight;
    const isNum = h => { const c = R.card(this.run, h.cardID); return c && c.kind === 'num'; };
    let count = f.handCards.filter(isNum).length;
    for (const h of f.handCards) {
      if (count >= n || !f.numDraw.length) break;
      if (isNum(h)) continue;
      f.opDraw.splice(Math.floor(Math.random() * (f.opDraw.length + 1)), 0, h.cardID);
      h.cardID = f.numDraw.pop();
      this.freshIDs.add(h.cardID);
      count++;
    }
  }

  // 연필 깎기: 손패를 모두 덱 아래로 돌려보내고 새로 뽑아요 (버리기를 쓰지 않아요)
  sharpen() {
    const f = this.run.fight;
    if (this.busy || !f || !R.perkReady(this.run, 'sharpen')) return;
    this.usePerk('sharpen');
    f.sel = [];
    f.handCards.forEach(h => { const c = R.card(this.run, h.cardID); if (c) this.toPile(f, c); });
    f.handCards = [];
    this.refill();
    Sound.play('toss');
    this.log('연필 깎기: 손패를 새로 뽑았어요', 'info');
    this.save();
    this.checkStuck();
  }

  // 숫자 덱과 기호 덱을 합친 곳에서 무작위로 한 장 뽑아요. 덱이 비면 버린 더미를 섞어 다시 써요
  drawOne(f) {
    let n = f.numDraw.length, o = f.opDraw.length;
    if (n + o === 0) {
      if (!f.numPile.length && !f.opPile.length) return null;
      f.numDraw = shuffle(f.numPile); f.opDraw = shuffle(f.opPile);
      f.numPile = []; f.opPile = [];
      n = f.numDraw.length; o = f.opDraw.length;
    }
    return Math.random() * (n + o) < n ? f.numDraw.pop() : f.opDraw.pop();
  }

  toPile(f, c) { (c.kind === 'num' ? f.numPile : f.opPile).push(c.id); }

  cmpCard(a, b) {
    if (a.kind === b.kind) {
      if (a.kind === 'num') return (numVal(a) - numVal(b)) || (a.v - b.v);
      return OP_ORDER.indexOf(a.op) - OP_ORDER.indexOf(b.op);
    }
    return a.kind === 'num' ? -1 : 1;
  }

  refill() {
    const f = this.run.fight; if (!f) return;
    f.handCards = f.handCards.filter(h => !h.out);
    const fresh = new Set();
    while (f.handCards.length < this.run.hand) {
      const id = this.drawOne(f);
      if (id == null) break;
      f.handCards.push({ cardID: id, out: false });
      fresh.add(id);
    }
    // 부채꼴 손패는 정렬하지 않고 뽑은 순서대로 둬요
    this.freshIDs = fresh;
  }

  get selectedCards() { return (this.run.fight ? this.run.fight.sel : []).map(id => R.card(this.run, id)).filter(Boolean); }

  validity(s) {
    if (!s.length) return { ok: false, msg: '손패를 누르거나 훑어서 카드를 골라 수식을 만드세요' };
    for (let i = 0; i < s.length; i++) if ((i % 2 === 0) !== (s[i].kind === 'num')) return { ok: false, msg: '숫자와 기호를 번갈아 놓아야 해요' };
    if (s.length % 2 === 0) return { ok: false, msg: '숫자로 끝나야 계산할 수 있어요' };
    return { ok: true, msg: '' };
  }

  // 강화 효과를 빼고 왼쪽부터 계산한 값과 단계별 기록
  // 값은 큰 수(N)로 다뤄서 아무리 커져도 무한대가 되지 않아요
  chain(cs) {
    if (!cs.length) return { val: N.of(0), steps: [] };
    const steps = [];
    let val = N.of(numVal(cs[0]));
    for (let i = 1; i + 1 < cs.length; i += 2) {
      const o = cs[i], b = N.of(numVal(cs[i + 1])), a = val;
      let r, note = '';
      switch (o.op) {
        case '+':
          if (o.enh.includes('amp')) { r = N.add(a, N.mul(b, N.of(3))); note = '증폭: 오른쪽 ×3'; } else r = N.add(a, b);
          if (o.enh.includes('stack')) { r = N.add(r, N.of(o.bonus)); note = `적립 +${fmt(o.bonus)}`; }
          break;
        case '-':
          // 역전은 빼서 음수가 될 때 발동해서, 빼는 대신 두 수를 더하고 ×4 해요
          r = N.sub(a, b);
          if (o.enh.includes('flip') && r.s < 0) { r = N.mul(N.add(a, b), N.of(4)); note = '역전: 더하고 ×4'; }
          break;
        case '*': r = N.mul(a, b); break;
        case '/':
          if (o.enh.includes('exact') && N.divides(a, b)) { r = N.mul(N.mul(a, b), N.of(2)); note = '정확: 곱하고 ×2'; }
          else r = N.div(a, b);
          break;
        case '^':
          r = N.pow(a, b);
          if (Math.abs(N.num(b)) > CFG.powCap) note = `지수는 ${CFG.powCap}까지`;
          break;
      }
      val = r;
      const shown = o.enh.includes('amp') ? `${N.fmt(a)} + ${N.fmt(b)}×3` : `${N.fmt(a)} ${SYM[o.op]} ${N.fmt(b)}`;
      steps.push({ text: `${shown} = ${N.fmt(r)}`, note });
    }
    return { val, steps };
  }

  evaluate(cs, roll) {
    const res = { steps: [], fx: [], final: 0, hasLuck: false, luckHit: false };
    if (!cs.length) return res;
    const chained = this.chain(cs);
    res.steps = chained.steps;
    const isLog = R.isLog(this.run);
    // 로그 단계는 결과의 자릿수가 피해의 바탕이에요. 강화 효과는 그 자릿수에 붙어요
    let val;
    if (isLog) {
      val = chained.val.s > 0 ? Math.max(0, N.log(chained.val)) : 0;
      res.steps.push({ text: `자릿수 log₁₀ = ${fmt(Math.floor(val * 100) / 100)}`, note: '로그 단계' });
    } else {
      val = chained.val.v !== null ? chained.val.v : chained.val.s * BIG;
    }
    const fire = R.fireBonus(this.run);
    cs.forEach(c => { if (c.enh.includes('fire')) { val += fire; res.fx.push({ text: `불꽃 +${fmt(fire)}`, style: 'fx' }); } });
    cs.forEach(c => { if (c.enh.includes('gold')) { val *= 2; res.fx.push({ text: '황금 ×2', style: 'fxGold' }); } });
    cs.forEach(c => {
      if (!c.enh.includes('luck')) return;
      res.hasLuck = true;
      if (!roll) return;
      const chance = R.hasPerk(this.run, 'clover') ? 0.35 : CFG.luckChance;
      if (Math.random() < chance) { val *= 5; res.luckHit = true; res.fx.push({ text: '행운 ×5!!', style: 'fxGold' }); }
      else res.fx.push({ text: '행운은 다음 기회에', style: 'miss' });
    });
    res.final = Math.max(0, isLog ? Math.floor(val * 10) / 10 : Math.floor(Math.min(val, BIG)));
    return res;
  }

  // 수식이 정확 ÷ 카드로 끝날 때, 그 뒤에 놓으면 나누어떨어지는 손패 숫자 카드들 (후광 표시용)
  get exactDivisorIDs() {
    const sel = this.selectedCards, f = this.run.fight;
    const last = sel[sel.length - 1];
    if (!f || !last || last.op !== '/' || !last.enh.includes('exact')) return new Set();
    const a = this.chain(sel.slice(0, -1)).val;
    return new Set(f.handCards.filter(h => !h.out).map(h => R.card(this.run, h.cardID))
      .filter(c => c && c.kind === 'num' && N.divides(a, N.of(numVal(c)))).map(c => c.id));
  }

  select(id) {
    const f = this.run.fight;
    if (this.busy || !f) return;
    if (f.sel.length >= CFG.maxLen) { this.previewOverride = `수식은 최대 ${CFG.maxLen}장이에요`; return; }
    const h = f.handCards.find(h => h.cardID === id && !h.out); if (!h) return;
    h.out = true;
    f.sel.push(id);
    this.freshIDs = new Set();
    this.previewOverride = null;
  }

  unselect(id) {
    const f = this.run.fight;
    if (this.busy || !f) return;
    const i = f.sel.indexOf(id); if (i < 0) return;
    f.sel.splice(i, 1);
    const h = f.handCards.find(h => h.cardID === id); if (h) h.out = false;
    this.freshIDs = new Set();
    this.previewOverride = null;
  }

  async discard() {
    const f = this.run.fight;
    if (this.busy || !f || !f.sel.length || f.discLeft <= 0) return;
    this.busy = true;
    this.tossing = true;
    Sound.play('toss');
    paint();
    await wait(400);
    this.selectedCards.forEach(c => this.toPile(f, c));
    f.sel = [];
    f.discLeft--;
    this.tossing = false;
    this.refill();
    this.busy = false;
    this.save();
    this.checkStuck();
    paint();
  }

  checkStuck() {
    const f = this.run.fight; if (!f) return;
    const hasNum = f.handCards.some(h => { const c = R.card(this.run, h.cardID); return c && c.kind === 'num'; });
    if (!hasNum && f.discLeft === 0 && f.playsLeft > 0) this.gameOver('낼 수 있는 숫자 카드가 없고 버리기도 다 썼어요');
  }

  log(text, style, note = '') { if (this.run.fight) this.run.fight.log.push({ id: uid(), text, note, style }); }

  async play() {
    const cs = this.selectedCards, f = this.run.fight;
    if (this.busy || !this.validity(cs).ok || !f || f.playsLeft <= 0) return;
    this.busy = true;
    f.sel = [];
    f.playsLeft--;
    cs.forEach(c => this.toPile(f, c));
    const res = this.evaluate(cs, true);
    // 적립 카드는 쓸 때마다 보너스가 지금 물가만큼 커져요
    const step = this.stackStep;
    cs.forEach(c => { if (c.enh.includes('stack')) c.bonus += step; });
    // 행운 결과를 연출 전에 먼저 저장해서, 껐다 켜도 다시 굴릴 수 없게 해요
    f.score += res.final;
    f.resolving = true;
    // 이번 전투 최고 일격: 특전 고르기 창에서 보여줘요 (카드는 그때 모습 그대로 복사해 둬요)
    if (!f.best || res.final > f.best.final) f.best = { cards: JSON.parse(JSON.stringify(cs)), final: res.final };
    f.log = [{ id: uid(), text: cs.map(faceText).join(' '), note: '', style: 'expr' }];
    // 한 방 기록은 숫자 단계에서만 쳐요 (로그 단계의 자릿수와 섞이지 않게)
    const isLog = R.isLog(this.run);
    if (!isLog) this.run.bestPlay = Math.max(this.run.bestPlay, res.final);
    this.hiddenDamage = res.final;
    this.freshIDs = new Set();
    this.previewOverride = null;
    this.finalPop = false;
    this.save();
    this.updateProfile(p => {
      if (!isLog) p.stats.maxHit = Math.max(p.stats.maxHit, res.final);
      if (res.luckHit) p.stats.luckProcs++;
    });
    paint();

    for (const st of res.steps) { await wait(380); this.log(st.text, 'step', st.note); paint(); Sound.play('tick'); }
    for (const fx of res.fx) {
      await wait(450); this.log(fx.text, fx.style); paint();
      if (fx.style === 'miss') Sound.play('miss');
      else { Sound.play(fx.text.startsWith('행운') ? 'luck' : 'sparkle'); shake(1); }
    }
    await wait(200);

    // 최종 결과 숫자를 세어 올려요. 연필 톡 소리가 점점 높아지며 때리는 소리로 이어져요
    this.log('0', 'final');
    const frames = 20;
    for (let k = 1; k <= frames; k++) {
      const e = 1 - Math.pow(1 - k / frames, 3);
      const last = f.log[f.log.length - 1];
      last.text = R.dmgText(this.run, isLog ? Math.floor(res.final * e * 10) / 10 : Math.floor(res.final * e));
      paint();
      if (k % 3 === 1) Sound.play('tick', { rate: 1 + 0.7 * k / frames, vol: 0.45 });
      await wait(500 / frames);
    }
    this.finalPop = true;
    this.hiddenDamage = 0;
    // 때리는 순간: 피해가 클수록 더 높고 거친 소리와 더 큰 흔들림
    const level = Sound.hitLevel(res.final, f.hpMax);
    Sound.play(level ? `hit${level}` : 'miss');
    if (level >= 2) shake(level);
    const outcome = this.settle();
    paint();
    if (outcome.win) {
      this.showStamp = true; paint();
      await wait(1200);
      this.showStamp = false;
    } else if (outcome.lose) {
      await wait(700);
    }
    this.finish(outcome);
    paint();
  }

  // 저장된 계산 결과로 승패를 정하고 골드와 기록을 반영해요
  settle() {
    const run = this.run, f = run.fight, node = this.fightNode;
    if (!f || !node) return {};
    f.resolving = false;
    if (f.score >= f.hpMax) {
      const over = f.score - f.hpMax;
      const rate = R.leftoverRate(run);
      const g1 = rnd(CFG.killGold * R.econ(run));
      const g2 = overkillGold(over, f.hpMax, node.type);
      const g3 = f.discLeft * rate.disc;
      const g4 = f.playsLeft * rate.play;
      const gain = g1 + g2 + g3 + g4;
      run.gold += gain;
      run.goldTotal += gain;
      run.kills++;
      run.lastGold = { g1, g2, g3, g4, gain, over, hp: f.hpMax, disc: f.discLeft, plays: f.playsLeft, ratePlay: rate.play, rateDisc: rate.disc, type: node.type,
        cap: rnd(overkillCap(f.hpMax, node.type)) };  // 골드를 계산할 때 쓴 상한 (물가 포함) 그대로 보여줘요
      const oneShot = f.playsLeft === run.plays - 1;
      this.updateProfile(p => {
        p.stats.kills++;
        if (node.type === 'elite') p.stats.eliteKills++;
        if (node.type === 'boss') p.stats.bossKills++;
        if (oneShot) p.stats.oneShots++;
        if (over >= f.hpMax * 2) p.stats.bigOverkills++;
        p.stats.maxGold = Math.max(p.stats.maxGold, run.gold);
      });
      this.log(`처치 ${fmt(g1)} + 초과 피해 ${fmt(g2)} + 남은 계산 ${fmt(g4)} + 남은 버리기 ${fmt(g3)} = 골드 +${fmt(gain)}`, 'fxGold');
      return { win: node.type === 'elite' ? 2 : 1 };
    }
    // 뒷심: 막마다 한 번, 거의 다 잡았으면 한 번 더 계산해요
    if (f.playsLeft === 0 && f.hpMax - f.score <= f.hpMax * 0.2 && R.perkReady(run, 'grit')) {
      this.usePerk('grit');
      f.playsLeft = 1;
      this.log('뒷심! 한 번 더 계산할 수 있어요', 'fxGold');
      return {};
    }
    if (f.playsLeft === 0) return { lose: `${node.name}의 체력이 ${R.hpText(run, f.hpMax - f.score)} 남았어요` };
    return {};
  }

  finish(outcome) {
    this.busy = false;
    if (outcome.win) this.openReward(outcome.win);
    else if (outcome.lose) this.gameOver(outcome.lose);
    else { this.refill(); this.save(); this.checkStuck(); }
  }

  // ----- 특전 -----
  genPerks() {
    const run = this.run, deck = run.deck;
    const enchant = e => () => {
      const cs = deck.filter(c => !PLAIN_OPS.includes(c.op) && !c.enh.includes(e)); if (!cs.length) return null;
      const c = pick(cs);
      return { kind: 'enchant', enh: e, cardID: c.id, title: `${cardLabel(c)}에 ${ENH[e].name}`, desc: ENH[e].desc };
    };
    const opPerk = e => () => {
      const cs = deck.filter(c => c.op === ENH[e].op && !c.enh.some(isOpPerk)); if (!cs.length) return null;
      const c = pick(cs);
      return { kind: 'opPerk', enh: e, cardID: c.id, title: `${cardLabel(c)}에 ${ENH[e].name}`, desc: ENH[e].desc };
    };
    const upNum = () => {
      // 변신 상한에 닿은 카드는 n을 올려도 값이 그대로라 빼요
      const cs = deck.filter(c => c.kind === 'num' && c.v < (trOf(c) ? trOf(c).cap : Infinity)); if (!cs.length) return null;
      const c = pick(cs);
      return { kind: 'upNum', cardID: c.id, title: `숫자 ${faceText(c)}의 n을 ${c.v + 3}으로`, desc: '이 카드의 값이 영구히 3 올라요' };
    };
    const trPerk = t => () => {
      const ti = TR.indexOf(t);
      const cs = deck.filter(c => c.kind === 'num' && trIndex(c) < ti && t.f(Math.min(c.v, t.cap)) > numVal(c)); if (!cs.length) return null;
      const c = pick(cs);
      const after = t.f(Math.min(c.v, t.cap));
      const title = c.tr ? `${faceText(c)}을 ${t.txt(Math.min(c.v, t.cap))}로` : `숫자 ${c.v}에 ${t.name}`;
      return { kind: 'transform', tr: t.key, cardID: c.id, title, desc: `변신하면 이 카드의 계산 값이 ${fmt(after)}이 돼요` };
    };
    // 6막부터: × 카드를 ^ 카드로 진화
    const evolve = () => {
      const cs = deck.filter(c => c.op === '*'); if (run.act < 6 || !cs.length) return null;
      const c = pick(cs);
      return { kind: 'evolve', cardID: c.id, title: '× 카드를 ^ 카드로 진화', desc: `거듭제곱: 왼쪽 수를 오른쪽 수만큼 거듭제곱해요 (지수는 ${CFG.powCap}까지)` };
    };
    // 8막 보스부터 보상: 테트레이션 3↑↑n (입력 1 차이로 값이 수조 배씩 튀어서 로그 단계에서 쓰게 해요)
    const tetra = () => {
      const t = TR.find(t => t.key === 'tet');
      const cs = deck.filter(c => c.kind === 'num' && c.tr !== 'tet' && t.f(Math.min(c.v, t.cap)) > numVal(c)); if (!cs.length) return null;
      const c = pick(cs);
      return { kind: 'transform', tr: 'tet', cardID: c.id, title: `숫자 ${faceText(c)}에 테트레이션`, desc: `보스 보상: 3↑↑n으로 변신해 계산 값이 ${fmt(t.f(Math.min(c.v, t.cap)))}이 돼요 (n은 ${t.cap}까지)` };
    };
    // 손패·계산 +1은 판을 크게 바꾸므로 뽑혀도 일정 확률로만 나와요
    const chance = p => Math.random() < p;
    const gens = [
      evolve, evolve,
      upNum, upNum,
      enchant('gold'), enchant('fire'), enchant('fire'), enchant('luck'),
      opPerk('amp'), opPerk('stack'), opPerk('flip'), opPerk('exact'), opPerk('amp'), opPerk('exact'),
      // 변신은 해금된 것마다 한 칸씩, 뽑혀도 일정 확률로만 나와요 (막이 오를수록 너무 많아지지 않게)
      ...R.unlockedTR(run).map(t => () => chance(CFG.trPerkRate) ? trPerk(t)() : null),
      // 손패·버리기 +1은 판을 크게 바꿔서 드물게, 상한까지만 나와요 (계산 기회 +1은 없어요)
      () => run.hand < CFG.handMax && chance(CFG.handPerkRate) ? { kind: 'handSize', glyph: '손+1', title: '손패 +1장', desc: '한 번에 들고 있는 카드가 늘어요' } : null,
      () => run.discards < CFG.discardMax && chance(CFG.discardPerkRate) ? { kind: 'discards', glyph: '버림', title: '버리기 +1', desc: '전투마다 한 번 더 버릴 수 있어요' } : null
    ];
    const node = this.fightNode;
    // 정예 사냥꾼: 정예를 잡으면 선택지 4개
    const size = node && node.type === 'elite' && R.hasPerk(run, 'hunter') ? 4 : 3;
    const out = [], used = new Set();
    // 같은 카드를 두 번 고르지 않고, 같은 종류의 특전도 두 번 내지 않아요
    const keys = o => [o.cardID != null ? 'c' + o.cardID : null, 'k' + o.kind + ':' + (o.enh || o.tr || '')].filter(Boolean);
    if (node && node.type === 'boss' && run.act >= TR.find(t => t.key === 'tet').act) {
      const t = tetra();
      if (t) { t.id = uid(); out.push(t); keys(t).forEach(k => used.add(k)); }
    }
    let guard = 0;
    while (out.length < size && guard++ < 200) {
      const o = pick(gens)(); if (!o) continue;
      if (keys(o).some(k => used.has(k))) continue;
      keys(o).forEach(k => used.add(k));
      o.id = uid();
      out.push(o);
    }
    return out;
  }

  openReward(count, idx = 1) {
    this.run.reward = { count, idx, offers: this.genPerks() };
    this.save();
  }

  choose(perk) {
    const run = this.run, reward = run.reward;
    if (!reward) return;
    Sound.play('coins');
    const c = perk.cardID != null ? R.card(run, perk.cardID) : null;
    if (c) {
      if (perk.kind === 'upNum') { c.v += 3; c.up++; }
      else if (perk.kind === 'enchant') c.enh.push(perk.enh);
      else if (perk.kind === 'opPerk') { c.enh.push(perk.enh); if (perk.enh === 'stack') c.bonus = this.stackStep; }
      else if (perk.kind === 'transform') c.tr = perk.tr;
      else if (perk.kind === 'evolve') { c.op = '^'; c.enh = []; }
      this.collect([c]);
    }
    if (perk.kind === 'handSize') run.hand++;
    if (perk.kind === 'plays') run.plays++;
    if (perk.kind === 'discards') run.discards++;
    if (reward.idx < reward.count) this.openReward(reward.count, reward.idx + 1);
    else {
      run.reward = null;
      this.afterNode(`${this.fightNode ? this.fightNode.name : '몹'} 처치! 골드 +${fmt(run.lastGold ? run.lastGold.gain : 0)}`);
    }
  }

  // 다시 뽑기: 막마다 한 번 특전 선택지를 새로
  rerollPerks() {
    const rw = this.run.reward;
    if (!rw || !R.perkReady(this.run, 'reroll')) return;
    this.usePerk('reroll');
    rw.offers = this.genPerks();
    Sound.play('swish', { rate: 0.8 });
    this.save();
  }

  // ----- 상점 -----
  // 할인권: 막마다 상점 첫 구매 30% 할인
  buyPrice(c) {
    const p = rnd(baseValue(c) * R.econ(this.run));
    return this.run.phase === 'shop' && R.perkReady(this.run, 'coupon') ? rnd(p * 0.7) : p;
  }
  // 적립 보너스의 시작값이자 1회 증가량 (물가에 비례, 최소 기본값)
  get stackStep() { return Math.max(CFG.stackStep, rnd(CFG.stackStep * R.econ(this.run))); }

  genShop() {
    const items = [], trs = R.unlockedTR(this.run);
    for (let i = 0; i < 3; i++) {
      const c = this.mk('num', 1 + Math.floor(Math.random() * 12));
      if (trs.length && Math.random() < CFG.shopTrRate) c.tr = pick(trs).key;
      if (Math.random() < 0.35) c.enh.push(pick(['gold', 'fire', 'fire', 'luck']));
      items.push(c);
    }
    for (let i = 0; i < 3; i++) {
      const op = pick(this.run.act >= 6 ? ['+', '+', '-', '/', '/', '*', '^'] : ['+', '+', '-', '/', '/', '*']);
      const c = this.mk('op', op);
      if (!PLAIN_OPS.includes(op)) {
        if (Math.random() < 0.65) {
          const e = pick(OP_PERKS.filter(k => ENH[k].op === op));
          c.enh.push(e);
          if (e === 'stack') c.bonus = this.stackStep;
        }
        if (Math.random() < 0.2) c.enh.push(pick(['gold', 'fire', 'luck']));
      }
      items.push(c);
    }
    return items;
  }

  openShop() {
    this.run.shop = { items: this.genShop(), pendingID: null, msg: `숫자 카드는 숫자와, 기호 카드는 기호와 바꿔요. 지금 물가는 1막 1층의 ${fmt(R.econ(this.run))}배예요.` };
    this.run.phase = 'shop';
    this.save();
  }

  get pendingItem() {
    const s = this.run.shop;
    return s && s.pendingID != null ? s.items.find(c => c.id === s.pendingID) : null;
  }

  togglePending(c) {
    if (this.run.gold < this.buyPrice(c)) return;
    this.run.shop.pendingID = this.run.shop.pendingID === c.id ? null : c.id;
  }

  // 고른 상점 카드를 덱의 카드와 바꿔요
  swap(old) {
    const pend = this.pendingItem, run = this.run;
    if (!pend || old.kind !== pend.kind) return;
    const p = this.buyPrice(pend);
    const i = run.deck.findIndex(c => c.id === old.id);
    if (run.gold < p || i < 0) return;
    run.gold -= p;
    if (R.perkReady(run, 'coupon')) this.usePerk('coupon');
    run.deck[i] = pend;
    run.shop.items = run.shop.items.filter(c => c.id !== pend.id);
    run.shop.msg = `${cardLabel(old)}을(를) 버리고 ${cardLabel(pend)}을(를) 넣었어요.`;
    run.shop.pendingID = null;
    this.updateProfile(p => p.stats.cardsBought++);
    this.collect([pend]);
    this.save();
  }

  // 재입고: 막마다 한 번 무료로 상점 물건을 새로
  restock() {
    const shop = this.run.shop;
    if (!shop || !R.perkReady(this.run, 'restock')) return;
    this.usePerk('restock');
    shop.items = this.genShop();
    shop.pendingID = null;
    shop.msg = '재입고! 물건을 새로 들여왔어요.';
    Sound.play('coins', { rate: 1.2, vol: 0.6 });
    this.save();
  }

  leaveShop() {
    const run = this.run;
    run.shop.pendingID = null;
    let msg = '상점을 나왔어요.';
    // 이자: 남은 골드의 10% (최대 물가 ×10)
    if (R.hasPerk(run, 'interest') && run.gold > 0) {
      const g = Math.min(rnd(run.gold * 0.1), rnd(10 * R.econ(run)));
      if (g > 0) { run.gold += g; run.goldTotal += g; msg += ` 이자 +${fmt(g)}골드.`; }
    }
    this.afterNode(msg);
  }

  get sortedDeck() { return this.run.deck.slice().sort((a, b) => this.cmpCard(a, b)); }

  describe(c) {
    const parts = [cardLabel(c)];
    const t = trOf(c);
    if (t) parts.push(`${t.name} 변신: 계산 값 ${fmt(numVal(c))}${c.v > t.cap ? ` (변신은 ${t.cap}까지만 적용)` : ''}`);
    if (c.up > 0) parts.push(`강화로 +${c.up * 3}`);
    c.enh.forEach(e => {
      let s = `${ENH[e].name}: ${ENH[e].desc}`;
      if (e === 'stack') s += ` (현재 +${fmt(c.bonus)})`;
      if (e === 'fire') s += ` (지금 +${fmt(R.fireBonus(this.run))})`;
      parts.push(s);
    });
    if (c.op === '*') parts.push('곱셈 카드는 강화할 수 없어요');
    if (c.op === '^') parts.push(`거듭제곱: 왼쪽 수를 오른쪽 수만큼 거듭제곱해요. 지수는 ${CFG.powCap}까지이고 강화할 수 없어요`);
    return parts.join('. ');
  }
}

// ===== 화면 그리기 =====
const isWide = () => matchMedia('(orientation: landscape) and (max-height: 520px)').matches;

function cardHTML(c, opts = {}) {
  const fire = opts.fire ?? (G ? R.fireBonus(G.run) : 10);
  const t = trOf(c);
  const cls = ['card', c.kind, ...c.enh.map(e => 'e-' + e)];
  if (t) cls.push('trans');
  if (opts.corner) cls.push('corner');
  if (opts.noshadow) cls.push('noshadow');
  if (opts.extra) cls.push(opts.extra);
  const face = c.kind === 'op' ? SYM[c.op] : t ? t.face(trInput(c)) : c.v;
  let badges = c.enh.map(e => {
    const label = ENH[e].badge + (e === 'stack' ? '+' + fmt(c.bonus) : '') + (e === 'fire' ? fmt(fire) : '');
    return `<i class="bd bd-${e}${isOpPerk(e) ? ' bd-op' : ''}">${label}</i>`;
  }).join('');
  if (c.up > 0) badges += `<i class="bd bd-up">▲${c.up * 3}</i>`;
  const many = c.enh.length + (c.up > 0 ? 1 : 0) >= 3;
  const style = opts.size ? ` style="font-size:${opts.size}px"` : '';
  return `<div class="${cls.join(' ')}" data-cid="${c.id}"${style} aria-label="${cardLabel(c)}"><span class="face">${face}</span><span class="bds${many ? ' many' : ''}">${badges}</span></div>`;
}

let lastScreen = null;
function paint() {
  const app = $('#app');
  const screen = G ? 'game:' + G.run.phase : 'menu';
  if (screen !== lastScreen) {
    lastScreen = screen;
    app.innerHTML = '';
    app.className = '';
    handEls.clear();
    window.scrollTo(0, 0);
  }
  if (!G) paintMenu(app);
  else paintGame(app);
  paintOverlays();
}

      <p>숫자와 기호로 수식을 만들어 몹을 쓰러뜨리는 카드 로그라이크</p>
      <div class="eq" aria-hidden="true">${cardHTML(numberCard(-1, 7))}${cardHTML(symbolCard(-2, '*'))}${cardHTML(numberCard(-3, 3))}<span class="h">= 21</span></div>
    </div>
    <div style="display:grid; gap:8px"><p class="sect">저장 슬롯</p>${slotRows}</div>
    <div style="display:grid; gap:10px">
      ${hasRun ? `<button class="btn" data-act="continue">이어하기</button><button class="btn ghost" data-act="newGameAsk">새 게임</button>`
               : `<button class="btn" data-act="start">시작하기</button>`}
    </div>
    <div class="tiles">
      <button class="tile" data-act="sheet" data-s="ach"><span class="ic">🏆</span><b>업적</b><span class="v h">${Object.keys(p.achievements).length}/${ACHIEVEMENTS.length}</span><small>슬롯 ${sel + 1}</small></button>
      <button class="tile" data-act="sheet" data-s="col"><span class="ic">🃏</span><b>카드 도감</b><span class="v h">${collectionCount(p)}/${CATALOG.length}</span><small>슬롯 ${sel + 1}</small></button>
      <button class="tile" data-act="sheet" data-s="perks"><span class="ic">🎒</span><b>퍽</b><span class="v h">${(p.perksUnlocked || []).length}/${PERKS.length}</span><small>${p.run ? `이번 판 ${(p.run.perks || []).length}개` : '시작할 때 골라요'}</small></button>
    </div>
    <p class="sect" style="text-align:center; font-weight:400">v${VERSION}</p>
